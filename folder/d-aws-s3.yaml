apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: faith-delivery-delay-train-t54

  annotations:
    scenarios.ai.sap.com/name: "FAITH Supplier Intelligence T54"
    scenarios.ai.sap.com/description: "d-1126yampredictionaws"
    executables.ai.sap.com/name: "1126yam-Delivery Delay Trainingaws"
    executables.ai.sap.com/description: "Train, evaluate and predict delivery delay"

  labels:
    scenarios.ai.sap.com/id: "faith-supplier-intelligence-t54"
    ai.sap.com/version: "1.0.8"

spec:
  imagePullSecrets:
    - name: faith-docker-t54

  entrypoint: training-pipeline

  templates:
    - name: training-pipeline
      steps:
        - - name: train-delivery-model
            template: training-container

    - name: training-container
      metadata:
        labels:
          ai.sap.com/resourcePlan: starter

      container:
        image: docker.io/raajgk77/faith-delivery-delay:day4-v1

        command:
          - python

        args:
          - /app/src/main.py

        env:
          - name: OUTPUT_DIR
            value: /app/output
