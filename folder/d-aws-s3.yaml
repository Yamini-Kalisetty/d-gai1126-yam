apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate

metadata:
  name: yam1126-delivery-delay-train-t54

  annotations:
    scenarios.ai.sap.com/name: "yam1126 aws T54"
    scenarios.ai.sap.com/description: "yam1126Delivery aws using mock data"
    executables.ai.sap.com/name: "yam1126Delivery Delay Training"
    executables.ai.sap.com/description: "yam1126Train, evaluate and predict delivery delay"

  labels:
    scenarios.ai.sap.com/id: "yam1126supplierintelligencet54"
    ai.sap.com/version: "1.0.6"

spec:
  imagePullSecrets:
    - name: gai1126-yam

  entrypoint: training-pipeline

  templates:
    - name: training-pipeline
      steps:
        - - name: train-delivery-model
            template: training-container

    - name: training-container
      metadata:
        labels:
          ai.sap.com/resourcePlan: starter

      container:
        image: docker.io/raajgk77/gai1126a-delivery-delay:day4-v1

        command:
          - python

        args:
          - /app/src/main.py

        env:
          - name: OUTPUT_DIR
            value: /app/output
