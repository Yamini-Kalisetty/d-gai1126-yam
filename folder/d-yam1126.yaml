apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: ExeIDfirst-inimay  
  annotations:
    scenarios.ai.sap.com/description: " 4Nov1419 Descr to SAP AI Core Scenario"
    scenarios.ai.sap.com/name: "GAI1126A Scenario inimay"
    executables.ai.sap.com/description: "4Nov1419 Executable Descr"
    executables.ai.sap.com/name: "GAI1126A AI Exec inimay"
  labels:
    scenarios.ai.sap.com/id: "ScenarioIDAI"
    ai.sap.com/version: "1.0.1"
spec:
 
  entrypoint: inimaypipeline
  templates:
  - name: inimaypipeline
    steps:
    - - name: greet
        template: greeter

  - name: greeter
    container:
      image: docker.io/python:latest
      command:
        - python3
        - '-c'
      args:
       - |
        print("Hello from SAP AI Core")
